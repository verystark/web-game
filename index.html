<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaboom.js Platformer Game</title>
    <script src="https://unpkg.com/kaboom@3000/dist/kaboom.js"></script>
    <style>
        body {
            margin: 0;
            padding: 100px 0 0 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a2e;
        }
        canvas {
            border: 2px solid #16213e;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <script>
        
        // Initialize Kaboom
        kaboom({
            width: 800,
            height: 600,
            background: [135, 206, 235], // Sky blue background
        });

        // Define gravity
        setGravity(1600);

        let score = 0;
        let currentLevel = 1;
        let door = null;
        let platforms = []; // Array to track all platforms

        const scoreLabel = add([
            text("Score: 0", { size: 20 }),
            pos(10, 10),  // Top of viewport, above game canvas
            fixed(),       // So it stays on screen when player moves
            color(255, 255, 255) // White text for visibility
        ]);

        const levelLabel = add([
            text("Level: 1", { size: 20 }),
            pos(10, 35),
            fixed(),
            color(255, 255, 255) // White text for visibility
        ]);

        // Create player (square)
        const player = add([
            rect(40, 40),
            pos(100, 100),
            area(),
            body(),
            color(255, 100, 100), // Red square
            "player"
        ]);

        function spawnCoin() {
            // Adjust coin spawn position based on level
            let coinY;
            if (currentLevel === 3) {
                // For reverse gravity, spawn coins in lower part of screen
                coinY = rand(100, height() - 50);
            } else {
                // For normal levels, spawn coins in upper/middle part
                coinY = rand(50, height() - 100);
            }
            
            const coin = add([
                circle(15),                  // coin shape
                pos(rand(50, width() - 50), coinY),  // random position
                area(),
                color(255, 223, 0),          // yellow
                "coin"
            ]);
        }

        function spawnDoor() {
            if (door) return; // Door already exists
            
            // Position door based on current level
            let doorY;
            if (currentLevel === 3) {
                doorY = 20; // Top of screen for reverse gravity level
            } else {
                doorY = 480; // Bottom platform for normal levels
            }
            
            door = add([
                rect(50, 80),
                pos(700, doorY),
                area(),
                color(139, 0, 139), // Purple door
                "door"
            ]);
        }

        function clearLevel() {
            // Remove all platforms, coins, and door
            destroyAll("platform");
            destroyAll("coin");
            platforms = []; // Clear platforms array
            if (door) {
                destroy(door);
                door = null;
            }
        }

        // Level variable to keep track of what level is currently being played
        let currentLevelIs = 0;
        
        // Function to determine if player is on ground level based on screen position or platform
        function isOnGroundLevel() {
            const playerBottom = player.pos.y + player.height;
            const playerTop = player.pos.y;
            const playerLeft = player.pos.x;
            const playerRight = player.pos.x + player.width;
            const threshold = 10; // Small threshold for detection
            
            // Check if player is standing on any platform
            for (const platform of platforms) {
                const platformTop = platform.pos.y;
                const platformBottom = platform.pos.y + platform.height;
                const platformLeft = platform.pos.x;
                const platformRight = platform.pos.x + platform.width;
                
                if (currentLevelIs === 3) {
                    // Reverse gravity: player is on platform if player's top is at/below platform's bottom
                    // and player is within platform's horizontal bounds
                    if (playerTop <= platformBottom + threshold && 
                        playerTop >= platformBottom - threshold &&
                        playerRight > platformLeft && 
                        playerLeft < platformRight) {
                        return true;
                    }
                } else {
                    // Normal gravity: player is on platform if player's bottom is at/above platform's top
                    // and player is within platform's horizontal bounds
                    if (playerBottom >= platformTop - threshold && 
                        playerBottom <= platformTop + threshold &&
                        playerRight > platformLeft && 
                        playerLeft < platformRight) {
                        return true;
                    }
                }
            }
            
            // Also check screen boundaries (ground/roof level)
            if (currentLevelIs === 3) {
                // Reverse gravity: ground is at the top (roof)
                return playerTop <= 40 + threshold; // Roof platform is 40px tall at y=0
            } else {
                // Normal gravity: ground is at the bottom
                return playerBottom >= height() - 40 - threshold; // Ground platform is 40px tall
            }
        }
        
        function createLevel1() {
            ++currentLevelIs;
            currentLevel = 1;
            levelLabel.text = "Level: 1";
            setGravity(1600); // Normal gravity
            setBackground([135, 206, 235]); // Sky blue background
            
            // Ground platform
            platforms.push(add([
                rect(800, 40),
                pos(0, 560),
                area(),
                body({ isStatic: true }),
                color(34, 139, 34),
                "platform"
            ]));

            // Floating platforms
            platforms.push(add([
                rect(200, 30),
                pos(200, 400),
                area(),
                body({ isStatic: true }),
                color(139, 69, 19),
                "platform"
            ]));

            platforms.push(add([
                rect(200, 30),
                pos(500, 300),
                area(),
                body({ isStatic: true }),
                color(139, 69, 19),
                "platform"
            ]));

            platforms.push(add([
                rect(150, 30),
                pos(100, 200),
                area(),
                body({ isStatic: true }),
                color(139, 69, 19),
                "platform"
            ]));
        }

        function createLevel2() {
            ++currentLevelIs;
            currentLevel = 2;
            levelLabel.text = "Level: 2";
            setGravity(1600); // Normal gravity
            setBackground([255, 182, 193]); // Pink background

            // Ground platform
            platforms.push(add([
                rect(800, 40),
                pos(0, 560),
                area(),
                body({ isStatic: true }),
                color(70, 130, 180), // Steel blue
                "platform"
            ]));

            // Different platform layout for level 2
            platforms.push(add([
                rect(150, 30),
                pos(100, 450),
                area(),
                body({ isStatic: true }),
                color(255, 140, 0), // Dark orange
                "platform"
            ]));

            platforms.push(add([
                rect(150, 30),
                pos(300, 350),
                area(),
                body({ isStatic: true }),
                color(255, 140, 0),
                "platform"
            ]));

            platforms.push(add([
                rect(150, 30),
                pos(550, 250),
                area(),
                body({ isStatic: true }),
                color(255, 140, 0),
                "platform"
            ]));

            platforms.push(add([
                rect(150, 30),
                pos(200, 150),
                area(),
                body({ isStatic: true }),
                color(255, 140, 0),
                "platform"
            ]));

            platforms.push(add([
                rect(150, 30),
                pos(600, 100),
                area(),
                body({ isStatic: true }),
                color(255, 140, 0),
                "platform"
            ]));
        }

        function createLevel3() {
            ++currentLevelIs;
            currentLevel = 3;
            levelLabel.text = "Level: 3";
            setGravity(-1600); // Reverse gravity (negative)
            setBackground([20, 20, 30]); // Dark background

            // Ground platform at the top (roof)
            platforms.push(add([
                rect(800, 40),
                pos(0, 0),
                area(),
                body({ isStatic: true }),
                color(50, 50, 50), // Dark gray
                "platform"
            ]));

            // Floating platforms (upside down layout)
            platforms.push(add([
                rect(150, 30),
                pos(100, 150),
                area(),
                body({ isStatic: true }),
                color(100, 50, 150), // Dark purple
                "platform"
            ]));

            platforms.push(add([
                rect(150, 30),
                pos(300, 250),
                area(),
                body({ isStatic: true }),
                color(100, 50, 150),
                "platform"
            ]));

            platforms.push(add([
                rect(150, 30),
                pos(550, 350),
                area(),
                body({ isStatic: true }),
                color(100, 50, 150),
                "platform"
            ]));

            platforms.push(add([
                rect(150, 30),
                pos(200, 450),
                area(),
                body({ isStatic: true }),
                color(100, 50, 150),
                "platform"
            ]));

            platforms.push(add([
                rect(150, 30),
                pos(600, 500),
                area(),
                body({ isStatic: true }),
                color(100, 50, 150),
                "platform"
            ]));
        }

        // Remove coin on collision and update score
        player.onCollide("coin", (c) => {
            destroy(c);
            score += 1;
            scoreLabel.text = "Score: " + score;

            // Spawn door when score reaches 5 (Level 1 -> Level 2)
            if (score === 5 && currentLevel === 1) {
                spawnDoor();
            }
            
            // Spawn door when score reaches 10 (Level 2 -> Level 3)
            if (score === 10 && currentLevel === 2) {
                spawnDoor();
            }

            // Spawn a new coin immediately
            spawnCoin();
        });

        // Door collision - switch levels
        player.onCollide("door", () => {
            if (currentLevel === 1) {
                clearLevel();
                player.pos = vec2(100, 100);
                createLevel2();
                spawnCoin();
            } else if (currentLevelIs === 2) {
                clearLevel();
                player.pos = vec2(100, 500); // Start near bottom for reverse gravity
                createLevel3();
                spawnCoin();
            }
        });

        // Initialize level 1
        createLevel1();
        spawnCoin();

        let jumpCount = 0;
        const MAX_JUMPS = 2;

        // Player movement
        onKeyDown("left", () => {
            player.move(-200, 0);
        });

        onKeyDown("right", () => {
            player.move(200, 0);
        });

        onKeyPress("space", () => {
            // Allow jump if player is on ground level OR hasn't used both jumps yet
            if (isOnGroundLevel() || jumpCount < MAX_JUMPS) {
                // Use same jump force for all levels - Kaboom handles direction based on gravity
                if (currentLevelIs === 3) {
                    player.jump(-600);
                } else {
                    player.jump(600);
                }
                jumpCount++;
            }
        });

        // Prevent player from going off screen and reset jump count
        player.onUpdate(() => {
            // Reset jump count when player reaches ground level
            if (isOnGroundLevel()) {
                jumpCount = 0;
            }
            
            // Keep player within horizontal bounds
            if (player.pos.x < 0) {
                player.pos.x = 0;
            }
            if (player.pos.x > width() - player.width) {
                player.pos.x = width() - player.width;
            }

            // Reset player position based on level
            if (currentLevel === 3) {
                // For reverse gravity, reset if player falls off the top
                if (player.pos.y < -50) {
                    player.pos = vec2(100, 500);
                }
            } else {
                // For normal levels, reset if player falls off the bottom
                if (player.pos.y > height()) {
                    player.pos = vec2(100, 100);
                }
            }
        });

        // Add instructions text
        add([
            text("Arrow Keys: Move | Space: Jump", {
                size: 16,
            }),
            pos(10, 60),  // Top of viewport, above game canvas
            color(255, 255, 255), // White text for visibility
            fixed(),
        ]);
    </script>
</body>
</html>
